<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>llming P2P viewer</title>
<!--LLMING_P2P_CONFIG-->
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #11151c; color: #e6edf3; }
  #llming-p2p-status {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; z-index: 999999;
    background: #11151c; transition: opacity .3s;
  }
  #llming-p2p-status .ring {
    width: 46px; height: 46px; border-radius: 50%;
    border: 4px solid #243; border-top-color: #4ade80; animation: spin 1s linear infinite;
  }
  #llming-p2p-status .label { font-size: 15px; letter-spacing: .3px; }
  #llming-p2p-status .sub { font-size: 12px; color: #7d8590; max-width: 80vw; text-align: center; }
  #llming-p2p-status.error .ring { border-top-color: #f87171; animation: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="llming-p2p-status">
  <div class="ring"></div>
  <div class="label">Connecting…</div>
  <div class="sub" id="llming-p2p-sub">starting peer-to-peer transport</div>
</div>
<script>
"use strict";
/*
 * Generic, application-neutral P2P viewer for llming-com.
 *
 * It is a *transparent tunnel*: it contains no app UI. It establishes a WebRTC
 * DataChannel to the host, overrides window.fetch and window.WebSocket so every
 * request flows over that channel (the DataChannelProxy protocol in
 * llming_com/p2p/proxy.py), then loads the real app from the host and replaces
 * this page with it.
 *
 * Signaling: HTTP (POST {offer_url}) by default; relay WebSocket when ?signal=ws.
 * Fallback:  if mode is "p2p+proxy" and P2P does not connect in time, the page
 *            navigates to the proxy hub URL instead.
 */
const WS_ID_LEN = 4;
const qs = new URLSearchParams(location.search);
// Pinned host-key fingerprint (#hk=…) AND the security key (#sk=…) ride in the
// pairing QR's URL FRAGMENT. Browsers never send the fragment to the server, so
// the relay sees neither — they travel out-of-band via the host-screen QR. This
// lets ONE scan open + pair + key in. Captured before history.replaceState strips it.
const _frag = new URLSearchParams(location.hash.replace(/^#/, ''));
const PINNED_HK = _frag.get('hk') || '';
const PROVIDED_SK = _frag.get('sk') || '';  // security key, if the invite carried it

function setStatus(label, sub, isError) {
  const box = document.getElementById('llming-p2p-status');
  if (!box) return;
  if (label) box.querySelector('.label').textContent = label;
  const subEl = document.getElementById('llming-p2p-sub');
  if (sub !== undefined && subEl) subEl.textContent = sub;
  box.classList.toggle('error', !!isError);
}
function hideStatus() {
  const box = document.getElementById('llming-p2p-status');
  if (box) { box.style.opacity = '0'; setTimeout(() => box.remove(), 350); }
}

// ---- configuration ----
// Either an inlined <script id="llming-p2p-config"> block (named publish URLs,
// stays on the stable URL) or a same-origin {prefix}/config fetch (raw viewer).
async function loadConfig() {
  const prefix = qs.get('prefix') || '/p2p';
  let cfg = {};
  const inline = document.getElementById('llming-p2p-config');
  if (inline && (inline.textContent || '').trim()) {
    try { cfg = JSON.parse(inline.textContent); } catch (e) { /* ignore */ }
  } else {
    try {
      const res = await fetch(prefix + '/config', { cache: 'no-store' });
      if (res.ok) cfg = await res.json();
    } catch (e) { /* fall through to query-param defaults */ }
  }
  return {
    signal: qs.get('signal') || cfg.signal || 'http',
    mode: qs.get('mode') || cfg.mode || 'p2p',
    offerUrl: qs.get('offer_url') || cfg.offer_url || (prefix + '/offer'),
    proxyFallbackUrl: qs.get('proxy') || cfg.proxy_fallback_url || '',
    connectTimeoutMs: parseInt(qs.get('timeout') || cfg.p2p_connect_timeout_ms || 8000, 10),
    relay: qs.get('relay') || cfg.relay || '',
    room: qs.get('room') || cfg.room || '',
    stun: Array.isArray(cfg.stun_servers) ? cfg.stun_servers : ['stun:stun.l.google.com:19302'],
    // Full ICE servers (STUN + TURN with credentials). When present these win
    // over `stun`, enabling a TURN-relayed path on networks that block direct P2P.
    iceServers: Array.isArray(cfg.ice_servers) ? cfg.ice_servers : null,
    // E2E-encrypted blind-relay fallback (set by the handshake descriptor).
    secureRelayUrl: cfg.secure_relay_url || '',
    hostPubkey: cfg.host_pubkey || '',
    // publish (named-app) front door — null for the raw viewer
    publish: cfg.publish || null,
    redeemUrl: cfg.redeem_url || '',
    handshakeUrl: cfg.handshake_url || '',
  };
}

// ---- durable device credential (survives reload / powersave / next day) ----
const CRED_DB = 'llming-publish';
function _credKey(slug) { return 'llming-cred:' + slug; }
function openCredDb() {
  if (!('indexedDB' in window)) return Promise.resolve(null);
  return new Promise((resolve) => {
    const req = indexedDB.open(CRED_DB, 1);
    req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains('creds')) req.result.createObjectStore('creds'); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => resolve(null);
  });
}
async function getCred(slug) {
  const db = await openCredDb();
  if (!db) { return localStorage.getItem(_credKey(slug)); }
  return new Promise((resolve) => {
    const r = db.transaction('creds', 'readonly').objectStore('creds').get(slug);
    r.onsuccess = () => resolve(r.result || localStorage.getItem(_credKey(slug)));
    r.onerror = () => resolve(localStorage.getItem(_credKey(slug)));
  });
}
async function putCred(slug, cred) {
  localStorage.setItem(_credKey(slug), cred); // fallback mirror
  const db = await openCredDb();
  if (!db) return;
  await new Promise((resolve) => {
    const r = db.transaction('creds', 'readwrite').objectStore('creds').put(cred, slug);
    r.onsuccess = () => resolve(); r.onerror = () => resolve();
  });
}
async function delCred(slug) {
  localStorage.removeItem(_credKey(slug));
  const db = await openCredDb();
  if (!db) return;
  await new Promise((resolve) => {
    const r = db.transaction('creds', 'readwrite').objectStore('creds').delete(slug);
    r.onsuccess = () => resolve(); r.onerror = () => resolve();
  });
}

// Pairing/share token: ?k=... (query) or #pt=... (fragment, kept out of history).
function pairingTokenFromUrl() {
  const fromQuery = qs.get('k');
  if (fromQuery) return fromQuery;
  const frag = new URLSearchParams(location.hash.replace(/^#/, ''));
  return frag.get('pt') || frag.get('pairing_token') || '';
}

// Front door for a named published app: ensure a device credential, then
// handshake for a fresh connection. Returns false if the device must pair first.
async function runPublishHandshake(cfg) {
  const slug = cfg.publish.account + '/' + cfg.publish.app;
  let cred = await getCred(slug);
  const token = pairingTokenFromUrl();
  if (!cred && token && cfg.redeemUrl) {
    setStatus('Pairing device…', 'redeeming your invite');
    try {
      const res = await fetch(cfg.redeemUrl, {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ pairing_token: token }), credentials: 'include',
      });
      if (res.ok) {
        cred = (await res.json()).device_credential;
        if (cred) await putCred(slug, cred);
        // strip the secret from the address bar (keep the stable URL bookmarkable)
        history.replaceState(null, '', location.pathname);
      }
    } catch (e) { /* fall through */ }
  }
  // No credential (first visit on a bare URL, or after sign-out). Make this
  // actionable instead of a dead end: scan the host's invite QR (or paste the
  // link) right here to re-pair.
  let note = '';
  while (!cred) {
    const invite = await promptForInvite(note);
    if (invite === null) {
      setStatus('Pair this device', 'scan the QR on the host screen to connect', true);
      return false;
    }
    let ik = '', ihk = '';
    try {
      const u = new URL(invite, location.href);
      ik = u.searchParams.get('k') || '';
      ihk = new URLSearchParams((u.hash || '').replace(/^#/, '')).get('hk') || '';
    } catch (e) { ik = invite; }  // maybe they pasted just the token
    if (!ik) { note = "that link didn't contain an invite code"; continue; }
    if (ihk && slug) { try { localStorage.setItem(hkKey(slug), ihk); } catch (e) {} }
    setStatus('Pairing device…', 'redeeming your invite');
    try {
      const res = await fetch(cfg.redeemUrl, {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ pairing_token: ik }), credentials: 'include',
      });
      if (res.ok) {
        cred = (await res.json()).device_credential;
        if (cred) { await putCred(slug, cred); history.replaceState(null, '', location.pathname); }
        else note = 'pairing failed — try a fresh QR';
      } else { note = 'invite invalid or expired — scan a fresh QR'; }
    } catch (e) { note = 'network error — try again'; }
  }
  setStatus('Reconnecting…', 'verifying this device and opening a fresh connection');
  let conn;
  try {
    const res = await fetch(cfg.handshakeUrl, {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ device_credential: cred }), credentials: 'include',
    });
    if (res.status === 401 || res.status === 403) {
      await delCred(slug);
      setStatus('Link expired', 'this published link is no longer active — ask for a new invite', true);
      return false;
    }
    conn = await res.json();
  } catch (e) {
    setStatus('Connection failed', String(e), true);
    return false;
  }
  // merge the fresh connection descriptor into cfg
  if (conn.mode) cfg.mode = conn.mode;
  if (conn.signal) cfg.signal = conn.signal;
  if (conn.offer_url) cfg.offerUrl = conn.offer_url;
  if (conn.relay) cfg.relay = conn.relay;
  if (conn.room) cfg.room = conn.room;
  if (conn.proxy_fallback_url) cfg.proxyFallbackUrl = conn.proxy_fallback_url;
  if (Array.isArray(conn.stun_servers)) cfg.stun = conn.stun_servers;
  if (Array.isArray(conn.ice_servers)) cfg.iceServers = conn.ice_servers;
  if (conn.secure_relay_url) cfg.secureRelayUrl = conn.secure_relay_url;
  if (conn.host_pubkey) cfg.hostPubkey = conn.host_pubkey;
  return true;
}

// ---- DataChannel proxy client ----
let dc = null;
const pendingHttp = new Map();   // id -> resolve
const wsClients = new Map();     // id -> fake WebSocket
let reqCounter = 0;
let wsCounter = 0;

function nextHttpId() { return 'r' + (++reqCounter); }
function nextWsId() { return 'w' + ((++wsCounter) % 1000); } // <= 4 chars for binary framing

function dcSend(obj) { dc.send(typeof obj === 'string' ? obj : JSON.stringify(obj)); }

function onDcMessage(ev) {
  const data = ev.data;
  if (data instanceof ArrayBuffer || ArrayBuffer.isView(data)) {
    const buf = data instanceof ArrayBuffer ? new Uint8Array(data) : new Uint8Array(data.buffer);
    const id = new TextDecoder().decode(buf.slice(0, WS_ID_LEN)).replace(/\0+$/, '');
    const sock = wsClients.get(id);
    if (sock && sock._emitMessage) sock._emitMessage(buf.slice(WS_ID_LEN));
    return;
  }
  let msg;
  try { msg = JSON.parse(data); } catch (e) { return; }
  const type = msg.type;
  if (type === 'http_response') {
    const resolve = pendingHttp.get(msg.id);
    if (resolve) { pendingHttp.delete(msg.id); resolve(msg); }
  } else if (type === 'pong') {
    /* keepalive; reconnect_token available in msg.reconnect_token */
  } else if (type === 'ws_ready') {
    const sock = wsClients.get(msg.id);
    if (sock && sock._open) sock._open();
  } else if (type === 'ws_text') {
    const sock = wsClients.get(msg.id);
    if (sock && sock._emitMessage) sock._emitMessage(msg.data);
  } else if (type === 'ws_close') {
    const sock = wsClients.get(msg.id);
    if (sock && sock._emitClose) sock._emitClose();
  }
}

// proxied fetch over the DataChannel
function proxyFetch(input, init) {
  init = init || {};
  let url = typeof input === 'string' ? input : input.url;
  const method = (init.method || (typeof input === 'object' && input.method) || 'GET').toUpperCase();
  let path;
  try { const u = new URL(url, location.origin); path = u.pathname + u.search; }
  catch (e) { path = url; }
  const headers = {};
  if (init.headers) new Headers(init.headers).forEach((v, k) => { headers[k] = v; });
  const id = nextHttpId();
  return new Promise((resolve) => {
    pendingHttp.set(id, (msg) => {
      let body = msg.body || '';
      if (msg.binary) {
        const bin = atob(body);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        body = bytes;
      }
      resolve(new Response(body, { status: msg.status || 200, headers: msg.headers || {} }));
    });
    dcSend({ id, type: 'http', method, path, headers, body: init.body ? String(init.body) : '' });
  });
}

// proxied WebSocket over the DataChannel
function makeProxyWebSocket() {
  const RealWS = window.WebSocket;
  function ProxyWebSocket(url) {
    const id = nextWsId();
    let path;
    try { const u = new URL(url, location.origin); path = u.pathname + u.search; } catch (e) { path = url; }
    this.url = url; this.readyState = 0; // CONNECTING
    this.onopen = this.onmessage = this.onclose = this.onerror = null;
    const self = this;
    this._id = id;
    this._open = function () { self.readyState = 1; if (self.onopen) self.onopen({ type: 'open' }); };
    this._emitMessage = function (payload) { if (self.onmessage) self.onmessage({ data: payload }); };
    this._emitClose = function () { self.readyState = 3; wsClients.delete(id); if (self.onclose) self.onclose({ type: 'close' }); };
    wsClients.set(id, this);
    dcSend({ id, type: 'ws_open', path });
  }
  ProxyWebSocket.prototype.send = function (data) {
    if (typeof data === 'string') { dcSend({ id: this._id, type: 'ws_text', data }); return; }
    const payload = data instanceof ArrayBuffer ? new Uint8Array(data) : new Uint8Array(data.buffer || data);
    const idBytes = new TextEncoder().encode(this._id.slice(0, WS_ID_LEN));
    const frame = new Uint8Array(WS_ID_LEN + payload.length);
    frame.set(idBytes.slice(0, WS_ID_LEN), 0);
    frame.set(payload, WS_ID_LEN);
    dc.send(frame.buffer);
  };
  ProxyWebSocket.prototype.close = function () { dcSend({ id: this._id, type: 'ws_close' }); this._emitClose(); };
  ProxyWebSocket.CONNECTING = 0; ProxyWebSocket.OPEN = 1; ProxyWebSocket.CLOSING = 2; ProxyWebSocket.CLOSED = 3;
  ProxyWebSocket._real = RealWS;
  return ProxyWebSocket;
}

// ---- signaling ----
async function signalHttp(cfg, offerSdp) {
  const res = await fetch(cfg.offerUrl, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ sdp: offerSdp, type: 'offer' }),
  });
  if (!res.ok) throw new Error('signaling failed: ' + res.status);
  return (await res.json()).sdp;
}

function relayBase(cfg) {
  // Explicit relay (http/https/ws/wss) or default to this origin's /relay path.
  let base = cfg.relay || (location.origin + '/relay');
  base = base.replace(/^http:/, 'ws:').replace(/^https:/, 'wss:');
  if (!/^wss?:/.test(base)) base = (location.protocol === 'https:' ? 'wss://' : 'ws://') + base.replace(/^\/+/, '');
  return base.replace(/\/$/, '');
}

function signalWs(cfg, offerSdp) {
  return new Promise((resolve, reject) => {
    const base = relayBase(cfg);
    const ws = new (makeProxyWebSocket()._real)(base + '/' + encodeURIComponent(cfg.room));
    const timer = setTimeout(() => { try { ws.close(); } catch (e) {} reject(new Error('relay timeout')); }, 15000);
    ws.onopen = () => ws.send(JSON.stringify({ type: 'offer', sdp: offerSdp }));
    ws.onmessage = (ev) => {
      let msg; try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (msg.type === 'answer') { clearTimeout(timer); ws.close(); resolve(msg.sdp); }
    };
    ws.onerror = () => { clearTimeout(timer); reject(new Error('relay error')); };
  });
}

// Inspect the negotiated ICE candidate pair to tell a *direct* peer-to-peer
// link (host/srflx/prflx candidates) apart from one *relayed through TURN*
// (relay candidate). Returns 'direct' | 'turn' | 'unknown'.
async function detectIcePath(pc) {
  try {
    const stats = await pc.getStats();
    let pairId = null;
    stats.forEach((r) => { if (r.type === 'transport' && r.selectedCandidatePairId) pairId = r.selectedCandidatePairId; });
    let pair = null;
    stats.forEach((r) => {
      if (r.type !== 'candidate-pair') return;
      if ((pairId && r.id === pairId) || (!pairId && r.nominated && r.state === 'succeeded')) pair = r;
    });
    if (!pair) return 'unknown';
    let local = null, remote = null;
    stats.forEach((r) => {
      if (r.id === pair.localCandidateId) local = r;
      if (r.id === pair.remoteCandidateId) remote = r;
    });
    const types = [local && local.candidateType, remote && remote.candidateType];
    if (types.includes('relay')) return 'turn';
    return 'direct';
  } catch (e) { return 'unknown'; }
}

// Publish the live connection path so the loaded app can display it.
// transport: 'p2p' | 'proxy'; path: 'direct' | 'turn' | 'unknown'.
function publishConn(transport, path) {
  try { window.__llmingConn = { transport: transport, path: path || 'unknown' }; } catch (e) {}
}

async function waitIceComplete(pc) {
  if (pc.iceGatheringState === 'complete') return;
  await new Promise((resolve) => {
    const check = () => { if (pc.iceGatheringState === 'complete') { pc.removeEventListener('icegatheringstatechange', check); resolve(); } };
    pc.addEventListener('icegatheringstatechange', check);
    setTimeout(resolve, 3000);
  });
}

// ---- app boot: replace this page with the host app, loaded over the tunnel ----
async function bootApp() {
  setStatus('Loading app…', 'fetching app shell over the data channel');
  const res = await proxyFetch('/', { method: 'GET' });
  const html = await res.text();
  const doc = new DOMParser().parseFromString(html, 'text/html');
  // Move head styles/links, then body, re-executing scripts.
  document.title = doc.title || document.title;
  hideStatus();
  const newBody = doc.body ? doc.body.innerHTML : html;
  document.body.innerHTML = newBody;
  // copy non-script head elements (styles)
  doc.head.querySelectorAll('style, link[rel="stylesheet"]').forEach((el) => document.head.appendChild(el.cloneNode(true)));
  // re-execute scripts in order
  const scripts = Array.from(doc.querySelectorAll('script'));
  for (const old of scripts) {
    const s = document.createElement('script');
    if (old.src) { s.src = old.src; } else { s.textContent = old.textContent; }
    document.body.appendChild(s);
  }
}

// ---- E2E crypto v2 (Web Crypto; byte-compatible with llming_com/secure.py) ----
// ephemeral×ephemeral ECDH (PFS) + host-screen code → HKDF-SHA256(salt=SHA256(code),
// info=v2‖transcript) → AES-256-GCM. Host ephemeral is signed by the pinned key.
const E2E_INFO_V2 = new TextEncoder().encode('llming-com/e2e/v2 aes-256-gcm');
const enc = (s) => new TextEncoder().encode(s);

function b64uToBytes(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/'); s += '='.repeat((4 - s.length % 4) % 4);
  const bin = atob(s); const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function bytesToB64u(bytes) {
  let bin = ''; const u8 = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
  for (let i = 0; i < u8.length; i++) bin += String.fromCharCode(u8[i]);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function concatBytes(a, b) { const out = new Uint8Array(a.length + b.length); out.set(a, 0); out.set(b, a.length); return out; }
function bytesEqual(a, b) { if (a.length !== b.length) return false; let d = 0; for (let i = 0; i < a.length; i++) d |= a[i] ^ b[i]; return d === 0; }

async function e2eFingerprint(pubRawB64) {
  const digest = new Uint8Array(await crypto.subtle.digest('SHA-256', b64uToBytes(pubRawB64)));
  return bytesToB64u(digest).slice(0, 16);
}
async function e2eGenEphemeral() {
  const eph = await crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, false, ['deriveBits']);
  const pub = new Uint8Array(await crypto.subtle.exportKey('raw', eph.publicKey));
  return { priv: eph.privateKey, pubB64: bytesToB64u(pub) };
}
// Verify a raw P1363 ECDSA P-256/SHA-256 signature against the pinned host key.
async function e2eVerifySig(hostPubB64, dataBytes, sigB64) {
  try {
    const key = await crypto.subtle.importKey('raw', b64uToBytes(hostPubB64), { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
    return await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, key, b64uToBytes(sigB64), dataBytes);
  } catch (e) { return false; }
}
function normalizeCodeBytes(code) { return enc(code.toUpperCase().replace(/[^A-Z0-9]/g, '')); }
// Derive the v2 session key from our ephemeral, the host ephemeral, and the code.
async function e2eDeriveV2(ephPriv, hostEphB64, infoBytes, code) {
  const hostEph = await crypto.subtle.importKey('raw', b64uToBytes(hostEphB64), { name: 'ECDH', namedCurve: 'P-256' }, false, []);
  const secret = await crypto.subtle.deriveBits({ name: 'ECDH', public: hostEph }, ephPriv, 256);
  const hkdfKey = await crypto.subtle.importKey('raw', secret, 'HKDF', false, ['deriveKey']);
  const salt = new Uint8Array(await crypto.subtle.digest('SHA-256', normalizeCodeBytes(code)));
  const info = concatBytes(concatBytes(E2E_INFO_V2, new Uint8Array([0])), infoBytes);
  return await crypto.subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt: salt, info: info },
    hkdfKey, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function e2eSeal(aesKey, bytes) {
  const nonce = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv: nonce }, aesKey, bytes));
  return concatBytes(nonce, ct);
}
async function e2eOpen(aesKey, blob) {
  const u8 = blob instanceof Uint8Array ? blob : new Uint8Array(blob);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8.slice(0, 12) }, aesKey, u8.slice(12));
  return new Uint8Array(pt);
}

// Durable secrets in IndexedDB (mirrored to localStorage): the #hk pin and the
// host-screen code (the "decryption key"). Only with the code can we decrypt.
function hkKey(slug) { return 'llming-hk:' + slug; }
function codeKey(slug) { return 'llming-code:' + slug; }
function getStoredCode(slug) { try { return localStorage.getItem(codeKey(slug)) || ''; } catch (e) { return ''; } }
async function putStoredCode(slug, code) {
  try { localStorage.setItem(codeKey(slug), code); } catch (e) {}
  const db = await openCredDb(); if (!db) return;
  await new Promise((res) => { const r = db.transaction('creds', 'readwrite').objectStore('creds').put(code, codeKey(slug)); r.onsuccess = () => res(); r.onerror = () => res(); });
}

// ---- Sign out: wipe all stored keys + logins (the app calls this) ----
// Exposed on window so an app loaded through the viewer can offer a "sign out"
// that fully forgets this device: the decryption code, the host-key pin, the
// device credential — for one app or all. The app decides when to call it
// (and typically reloads afterwards to force a fresh pair).
let _publishSlug = '';
window.LlmingPublish = {
  get slug() { return _publishSlug; },
  // Forget one app (defaults to the current one). Returns a promise.
  async signOut(slug) {
    slug = slug || _publishSlug;
    if (!slug) return this.signOutAll();
    [hkKey(slug), codeKey(slug), _credKey(slug)].forEach((k) => { try { localStorage.removeItem(k); } catch (e) {} });
    const db = await openCredDb();
    if (db) {
      await new Promise((res) => {
        const store = db.transaction('creds', 'readwrite').objectStore('creds');
        ['code:' + slug, slug].forEach((key) => { try { store.delete(key); } catch (e) {} });
        store.transaction.oncomplete = () => res();
        store.transaction.onerror = () => res();
      });
    }
  },
  // Forget everything llming-com stored on this device.
  async signOutAll() {
    try { Object.keys(localStorage).filter((k) => k.indexOf('llming-') === 0).forEach((k) => localStorage.removeItem(k)); } catch (e) {}
    await new Promise((res) => { try { const r = indexedDB.deleteDatabase(CRED_DB); r.onsuccess = r.onerror = r.onblocked = () => res(); } catch (e) { res(); } });
  },
};

// Is the scanned text a pairing/invite URL (vs. the host-screen code)?
function looksLikeUrl(v) { return /^[a-z][a-z0-9+.-]*:\/\//i.test(v) || v.indexOf('://') >= 0; }
function looksLikeInvite(v) {
  try { return !!new URL(v, location.href).searchParams.get('k'); } catch (e) { return false; }
}
// The security key from a scan: the one-QR invite carries it in its #sk fragment,
// while a bare key QR is the key itself. Returns '' if the scan is neither.
function keyFromScan(v) {
  try {
    const sk = new URLSearchParams(new URL(v, location.href).hash.replace(/^#/, '')).get('sk');
    if (sk) return sk.trim();
  } catch (e) {}
  return (!looksLikeUrl(v) && v.length >= 8) ? v.trim() : '';
}

// Windowed camera QR scan (a guiding card, not fullscreen). Keeps scanning until
// a code passes opts.accept(value) — so e.g. scanning the INVITE URL while we
// want the CODE shows a hint and stays open. Resolves the value, or null.
function scanQrCode(opts) {
  opts = opts || {};
  const accept = opts.accept || (() => true);
  return new Promise((resolve) => {
    (async () => {
      try {
        if (!('BarcodeDetector' in window) || !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) { resolve(null); return; }
        const fmts = await window.BarcodeDetector.getSupportedFormats();
        if (!fmts.includes('qr_code')) { resolve(null); return; }
        const det = new window.BarcodeDetector({ formats: ['qr_code'] });
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });

        const backdrop = document.createElement('div');
        backdrop.setAttribute('style', 'position:fixed;inset:0;z-index:1000000;background:rgba(0,0,0,.6)');
        const card = document.createElement('div');
        card.setAttribute('style', 'position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1000001;background:#161b22;border:1px solid #30363d;border-radius:16px;padding:14px;width:min(86vw,340px);text-align:center;font-family:system-ui,sans-serif;color:#e6edf3;box-shadow:0 12px 50px rgba(0,0,0,.6)');
        const vid = document.createElement('video'); vid.setAttribute('playsinline', 'true'); vid.muted = true; vid.autoplay = true;
        vid.setAttribute('style', 'width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;background:#000');
        const titleEl = document.createElement('div'); titleEl.setAttribute('style', 'font-size:14px;font-weight:600;margin-bottom:8px'); titleEl.textContent = opts.title || 'Scan QR';
        const hint = document.createElement('div'); hint.setAttribute('style', 'font-size:12px;color:#7d8590;margin-top:8px;min-height:16px'); hint.textContent = opts.hint || 'point your camera at the QR';
        const cancel = document.createElement('button'); cancel.textContent = 'Cancel'; cancel.setAttribute('style', 'margin-top:10px;padding:8px 16px;border-radius:10px;border:1px solid #30363d;background:#0d1117;color:#e6edf3;font-size:13px');
        card.appendChild(titleEl); card.appendChild(vid); card.appendChild(hint); card.appendChild(cancel);
        document.body.appendChild(backdrop); document.body.appendChild(card); vid.srcObject = stream;

        let done = false, lastBad = '';
        const stop = (val) => { if (done) return; done = true; try { stream.getTracks().forEach((t) => t.stop()); } catch (e) {} try { card.remove(); } catch (e) {} try { backdrop.remove(); } catch (e) {} resolve(val); };
        cancel.onclick = () => stop(null);
        backdrop.onclick = () => stop(null);
        const tick = async () => {
          if (done) return;
          try {
            const codes = await det.detect(vid);
            if (codes && codes.length) {
              // Both QRs may be in frame (they sit side by side on the host). Pick
              // the FIRST detected code that passes the validator — so the key code
              // is found even with the invite QR alongside it.
              let picked = null;
              for (let i = 0; i < codes.length; i++) {
                const cv = (codes[i].rawValue || '').trim();
                if (cv && accept(cv)) { picked = cv; break; }
              }
              if (picked) { stop(picked); return; }
              const first = (codes[0].rawValue || '').trim();
              if (first && first !== lastBad) { lastBad = first; hint.textContent = opts.reject || "that's the wrong QR — keep scanning"; hint.style.color = '#f87171'; }
            }
          } catch (e) {}
          requestAnimationFrame(tick);
        };
        vid.addEventListener('loadeddata', () => requestAnimationFrame(tick), { once: true });
      } catch (e) { resolve(null); }
    })();
  });
}

// Re-pair an un-credentialed device (e.g. after sign-out): scan the host's
// invite QR or paste the invite link. Returns the invite URL/token, or null.
function promptForInvite(note) {
  return new Promise((resolve) => {
    const box = document.getElementById('llming-p2p-status');
    if (box) box.style.display = 'none';
    const ov = document.createElement('div');
    ov.setAttribute('style', 'position:fixed;inset:0;z-index:1000000;background:#11151c;color:#e6edf3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:system-ui,sans-serif;padding:24px;text-align:center');
    const canScan = ('BarcodeDetector' in window) && navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
    ov.innerHTML =
      '<div style="font-size:17px;font-weight:600">Pair this device</div>' +
      '<div style="font-size:13px;color:#7d8590;max-width:80vw">' + (canScan ? 'Scan the QR shown on the host, or paste the invite link.' : 'Paste the invite link shown on the host.') + '</div>' +
      (note ? '<div style="color:#f87171;font-size:13px">' + note + '</div>' : '') +
      '<input id="llming-inv-in" spellcheck="false" placeholder="https://…?k=…" style="width:min(80vw,360px);padding:12px;border-radius:10px;border:1px solid #30363d;background:#0d1117;color:#e6edf3;font-family:ui-monospace,monospace;font-size:14px;text-align:center">' +
      '<div style="display:flex;gap:10px">' +
      (canScan ? '<button id="llming-inv-scan" style="padding:10px 18px;border-radius:10px;border:1px solid #30363d;background:#161b22;color:#79c0ff;font-size:14px">Scan QR</button>' : '') +
      '<button id="llming-inv-ok" style="padding:10px 18px;border-radius:10px;border:1px solid #1f6feb;background:#1f6feb;color:#fff;font-size:14px">Connect</button>' +
      '</div>';
    document.body.appendChild(ov);
    const input = ov.querySelector('#llming-inv-in'); input.focus();
    const finish = (val) => { try { ov.remove(); } catch (e) {} if (box) box.style.display = ''; resolve(val); };
    ov.querySelector('#llming-inv-ok').onclick = () => { const v = input.value.trim(); if (v) finish(v); };
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { const v = input.value.trim(); if (v) finish(v); } });
    const sb = ov.querySelector('#llming-inv-scan');
    if (sb) sb.onclick = () => scanQrCode({
      title: 'Scan the invite QR',
      hint: 'the QR that opens the board on a phone',
      reject: "that's the key code — scan the INVITE QR instead",
      accept: looksLikeInvite,
    }).then((v) => { if (v) finish(v); });
  });
}

// Ask the user for the host-screen code: paste field always; camera scan when
// BarcodeDetector is available. Returns the code string, or null if cancelled.
function promptForCode(retry) {
  return new Promise((resolve) => {
    const box = document.getElementById('llming-p2p-status');
    if (box) box.style.display = 'none';
    const ov = document.createElement('div');
    ov.setAttribute('style', 'position:fixed;inset:0;z-index:1000000;background:#11151c;color:#e6edf3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:system-ui,sans-serif;padding:24px;text-align:center');
    const canScan = ('BarcodeDetector' in window) && navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
    ov.innerHTML =
      '<div style="font-size:17px;font-weight:600">Pair this device</div>' +
      '<div style="font-size:13px;color:#7d8590;max-width:80vw">Enter the security key shown on the host' + (canScan ? ', or scan it.' : '.') + '</div>' +
      (retry ? '<div style="color:#f87171;font-size:13px">That key didn\'t match — try again.</div>' : '') +
      '<input id="llming-code-in" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-…" style="width:min(80vw,320px);padding:12px;border-radius:10px;border:1px solid #30363d;background:#0d1117;color:#e6edf3;font-family:ui-monospace,monospace;font-size:16px;text-align:center">' +
      '<div style="display:flex;gap:10px">' +
      (canScan ? '<button id="llming-code-scan" style="padding:10px 18px;border-radius:10px;border:1px solid #30363d;background:#161b22;color:#79c0ff;font-size:14px">Scan QR</button>' : '') +
      '<button id="llming-code-ok" style="padding:10px 18px;border-radius:10px;border:1px solid #1f6feb;background:#1f6feb;color:#fff;font-size:14px">Connect</button>' +
      '</div>';
    document.body.appendChild(ov);
    const input = ov.querySelector('#llming-code-in');
    input.focus();
    const finish = (val) => { try { ov.remove(); } catch (e) {} if (box) box.style.display = ''; resolve(val); };
    ov.querySelector('#llming-code-ok').onclick = () => { const v = input.value.trim(); if (v) finish(v); };
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { const v = input.value.trim(); if (v) finish(v); } });
    const scanBtn = ov.querySelector('#llming-code-scan');
    if (scanBtn) scanBtn.onclick = () => scanQrCode({
      title: 'Scan the host QR',
      hint: 'point your camera at the QR on the host',
      reject: "that QR has no security key — scan the host's QR",
      accept: (v) => !!keyFromScan(v),  // the key, or a one-QR invite carrying it in #sk
    }).then((v) => { const k = v && keyFromScan(v); if (k) finish(k); });
  });
}

// Transport-agnostic secure session. Runs the SAME two-step, code-bound
// handshake over ANY open byte link (relay WebSocket OR WebRTC DataChannel):
// connect → receive the signed response + canary probe → decrypt the probe with
// the stored/entered code (else prompt) → connect. Frames are kind||body
// ('H' hello, 'R' response, 'A' sealed app frame, 'C' close). `link` is
// { send(Uint8Array), setOnFrame(cb), close() }, already open. `connInfo` is the
// path label to publish on success. Resolves true when established.
async function runSecureSession(cfg, slug, link, connInfo) {
  if (!cfg.hostPubkey) return false;
  const fp = await e2eFingerprint(cfg.hostPubkey);
  const pinned = PINNED_HK || (slug ? localStorage.getItem(hkKey(slug)) : '');
  if (pinned && pinned !== fp) {
    setStatus('Security check failed', 'the host key does not match the pinned fingerprint — refusing to connect', true);
    try { link.close(); } catch (e) {}
    return true; // handled — never fall through to a plaintext path
  }
  if (slug && !pinned) localStorage.setItem(hkKey(slug), fp); // trust on first use
  const eph = await e2eGenEphemeral();

  return await new Promise((resolve) => {
    let settled = false, aesKey = null;
    let sendChain = Promise.resolve(), recvChain = Promise.resolve();
    const done = (ok) => { if (settled) return; settled = true; if (!ok) { try { link.close(); } catch (e) {} } resolve(ok); };
    link.onClose = () => { if (!aesKey) done(false); };
    link.setOnFrame((u8) => { recvChain = recvChain.then(() => onFrame(u8)); });
    link.send(concatBytes(new Uint8Array([0x48]), enc(JSON.stringify({ epub: eph.pubB64 }))));  // hello

    async function onFrame(u8) {
      const kind = u8[0];
      if (kind === 0x52) { await onResponse(JSON.parse(new TextDecoder().decode(u8.slice(1)))); return; }   // 'R'
      if (kind === 0x43) { setStatus('Disconnected', 'the secure session was closed', true); return; }      // 'C'
      if (kind !== 0x41 || !aesKey) return;                                                                  // 'A'
      let plain; try { plain = await e2eOpen(aesKey, u8.slice(1)); } catch (e) { return; }
      const tag = plain[0], body = plain.slice(1);
      if (tag === 0x4A) onDcMessage({ data: new TextDecoder().decode(body) });
      else if (tag === 0x42) onDcMessage({ data: body });
    }

    async function tryCode(resp, infoBytes, code) {
      try {
        const k = await e2eDeriveV2(eph.priv, resp.epub, infoBytes, code);
        const opened = await e2eOpen(k, b64uToBytes(resp.probe));
        if (bytesEqual(opened, enc('llming-probe-v2:' + resp.nonce))) return k;
      } catch (e) {}
      return null;
    }

    async function onResponse(resp) {
      const sigOk = await e2eVerifySig(cfg.hostPubkey, b64uToBytes(resp.epub), resp.sig);
      if (!sigOk) { setStatus('Security check failed', 'host signature invalid — refusing to connect', true); done(false); return; }
      const infoBytes = enc(cfg.hostPubkey + '|' + eph.pubB64 + '|' + resp.epub);
      // Prefer a stored key; else the key from the invite's #sk fragment (one-scan
      // pairing); else prompt. The relay never saw either.
      let code = (slug ? getStoredCode(slug) : '') || PROVIDED_SK || '';
      let key = code ? await tryCode(resp, infoBytes, code) : null;
      let retried = false;
      while (!key) {
        const entered = await promptForCode(retried); retried = true;
        if (entered === null) { setStatus('Pairing needed', 'enter the host-screen code to connect', true); done(false); return; }
        code = entered; key = await tryCode(resp, infoBytes, code);
      }
      aesKey = key;
      if (slug) await putStoredCode(slug, code);
      dc = {
        send: (data) => {
          sendChain = sendChain.then(async () => {
            const tagged = (typeof data === 'string')
              ? concatBytes(new Uint8Array([0x4A]), enc(data))                                  // 'J'
              : concatBytes(new Uint8Array([0x42]), new Uint8Array(data.buffer || data));        // 'B'
            const sealed = await e2eSeal(aesKey, tagged);
            link.send(concatBytes(new Uint8Array([0x41]), sealed));                              // 'A'
          });
        },
      };
      connectedSecure(cfg, connInfo);
      done(true);
    }
  });
}

// Encrypted relay transport: a blind WebSocket the hub forwards.
async function connectSecureRelay(cfg, slug) {
  if (!cfg.secureRelayUrl || !cfg.hostPubkey) return false;
  setStatus('Connecting…', 'establishing an end-to-end encrypted channel');
  const u = new URL(cfg.secureRelayUrl, location.href);
  u.protocol = (location.protocol === 'https:') ? 'wss:' : 'ws:';
  const ws = new (makeProxyWebSocket()._real)(u.href);
  ws.binaryType = 'arraybuffer';
  const opened = await new Promise((res) => { ws.onopen = () => res(true); ws.onerror = () => res(false); });
  if (!opened) return false;
  const link = {
    send: (u8) => ws.send(u8.buffer),
    setOnFrame: (cb) => { ws.onmessage = (ev) => cb(new Uint8Array(ev.data)); },
    close: () => { try { ws.close(); } catch (e) {} },
    onClose: null,
  };
  ws.onclose = () => { if (link.onClose) link.onClose(); };
  return await runSecureSession(cfg, slug, link, { transport: 'proxy', path: 'e2e' });
}

let _secureBooted = false;
async function connectedSecure(cfg, connInfo) {
  if (_secureBooted) return;
  _secureBooted = true;
  publishConn(connInfo.transport, connInfo.path);
  setStatus('Connected', 'end-to-end encrypted channel established');
  window.fetch = (input, init) => proxyFetch(input, init);
  window.WebSocket = makeProxyWebSocket();
  dcSend({ type: 'ping', ts: Date.now() });
  try { await bootApp(); } catch (e) { setStatus('App load failed', String(e), true); }
}

function gotoFallback(cfg, why) {
  // Prefer the E2E-encrypted blind relay; fall back to the legacy plaintext
  // proxy redirect only if no host key was published.
  const slug = cfg.publish ? cfg.publish.account + '/' + cfg.publish.app : '';
  if (cfg.secureRelayUrl && cfg.hostPubkey) {
    setStatus('Switching to encrypted relay…', why + ' — no direct path, relaying securely');
    connectSecureRelay(cfg, slug).then((ok) => {
      if (!ok && cfg.mode === 'p2p+proxy' && cfg.proxyFallbackUrl) location.href = cfg.proxyFallbackUrl;
    });
    return true;
  }
  if (cfg.mode === 'p2p+proxy' && cfg.proxyFallbackUrl) {
    setStatus('Switching to proxy…', why + ' — falling back to relay proxy');
    setTimeout(() => { location.href = cfg.proxyFallbackUrl; }, 600);
    return true;
  }
  return false;
}

async function main() {
  const cfg = await loadConfig();
  if (cfg.publish) _publishSlug = cfg.publish.account + '/' + cfg.publish.app;  // for LlmingPublish.signOut()
  // Named published app: resolve a durable device credential and handshake for a
  // fresh connection before connecting. This is what makes reload-after-powersave
  // reconnect without re-scanning a QR code.
  if (cfg.publish) {
    const ready = await runPublishHandshake(cfg);
    if (!ready) return;
  }
  if (cfg.mode === 'proxy') {
    if (!gotoFallback(cfg, 'proxy mode')) setStatus('Proxy not configured', 'mode=proxy but no relay/proxy target', true);
    return;
  }

  let connected = false;
  const fallbackTimer = setTimeout(() => {
    if (!connected) {
      if (!gotoFallback(cfg, 'P2P timed out')) setStatus('Connection failed', 'P2P timed out and no proxy fallback', true);
    }
  }, cfg.connectTimeoutMs);

  try {
    const iceServers = cfg.iceServers && cfg.iceServers.length
      ? cfg.iceServers
      : cfg.stun.map((u) => ({ urls: u }));
    const pc = new RTCPeerConnection({ iceServers: iceServers });
    const channel = pc.createDataChannel('llming', { ordered: true });
    channel.binaryType = 'arraybuffer';
    channel.onopen = async () => {
      connected = true;
      clearTimeout(fallbackTimer);
      const path = await detectIcePath(pc);
      const slug = cfg.publish ? cfg.publish.account + '/' + cfg.publish.app : '';
      // P2P is code-bound too: run the SAME secure handshake over the DataChannel.
      // A malicious signaling relay can't MITM it and can't connect without the
      // host-screen code. Requires a published host key (#hk / host_pubkey).
      if (cfg.hostPubkey) {
        const link = {
          send: (u8) => channel.send(u8),
          setOnFrame: (cb) => {
            channel.onmessage = (ev) => {
              const d = ev.data;
              cb(d instanceof ArrayBuffer ? new Uint8Array(d) : ArrayBuffer.isView(d) ? new Uint8Array(d.buffer) : enc(d));
            };
          },
          close: () => { try { channel.close(); } catch (e) {} },
          onClose: null,
        };
        channel.onclose = () => { if (link.onClose) link.onClose(); };
        const ok = await runSecureSession(cfg, slug, link, { transport: 'p2p', path: path });
        if (!ok && !gotoFallback(cfg, 'secure handshake failed')) {
          setStatus('Connection failed', 'could not complete the secure handshake', true);
        }
      } else {
        // Legacy unencrypted P2P (no host key published) — relies on WebRTC DTLS.
        dc = channel;
        channel.onmessage = onDcMessage;
        publishConn('p2p', path);
        setStatus('Connected', path === 'turn' ? 'peer-to-peer via TURN relay' : 'direct peer-to-peer link established');
        window.fetch = (input, init) => proxyFetch(input, init);
        window.WebSocket = makeProxyWebSocket();
        dcSend({ type: 'ping', ts: Date.now() });
        try { await bootApp(); } catch (e) { setStatus('App load failed', String(e), true); }
      }
    };
    pc.onconnectionstatechange = () => {
      if (['failed', 'closed', 'disconnected'].includes(pc.connectionState) && !connected) {
        clearTimeout(fallbackTimer);
        if (!gotoFallback(cfg, 'P2P ' + pc.connectionState)) setStatus('Connection failed', 'P2P ' + pc.connectionState, true);
      }
    };

    setStatus('Negotiating…', 'creating offer and gathering candidates');
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await waitIceComplete(pc);

    setStatus('Signaling…', cfg.signal === 'ws' ? 'exchanging SDP via relay' : 'exchanging SDP via HTTP');
    const answerSdp = cfg.signal === 'ws' ? await signalWs(cfg, pc.localDescription.sdp)
                                          : await signalHttp(cfg, pc.localDescription.sdp);
    await pc.setRemoteDescription({ type: 'answer', sdp: answerSdp });
  } catch (e) {
    clearTimeout(fallbackTimer);
    if (!gotoFallback(cfg, 'signaling error')) setStatus('Connection failed', String(e), true);
  }
}

main();
</script>
