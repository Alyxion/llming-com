[tool.poetry]
name = "llming-com"
version = "0.1.7"
description = "Where JavaScript, Python, and AI agents speak the same language"
authors = ["Michael Ikemann"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/Alyxion/llming-com"
homepage = "https://github.com/Alyxion/llming-com"
keywords = ["websocket", "session", "auth", "hmac", "fastapi", "starlette"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.14",
]
packages = [{include = "llming_com"}]
include = [
    {path = "llming_com/static", format = ["sdist", "wheel"]},
    {path = "llming_com/server/p2p", format = ["sdist", "wheel"]},
]

[tool.poetry.urls]
"Author" = "https://github.com/Alyxion"

[tool.poetry.dependencies]
python = ">=3.14,<3.15"
starlette = ">=0.27"
fastapi = ">=0.100"
pydantic = ">=2"
httpx = ">=0.27"
websockets = ">=12"
cryptography = ">=42"
mcp = {version = ">=1.0", optional = true}
aiortc = {version = ">=1.13", optional = true}
# --- Courier subpackage (llming_com.courier) optional deps -------------------
# Core courier import (crypto/url/models/client) needs only pydantic +
# cryptography (already required above). The service/server/Azure paths add:
pydantic-settings = {version = ">=2.7,<3.0", optional = true}
uvicorn = {version = ">=0.34,<1.0", extras = ["standard"], optional = true}
python-multipart = {version = ">=0.0.18,<1.0", optional = true}
azure-storage-blob = {version = ">=12.24,<13.0", optional = true}
azure-identity = {version = ">=1.19,<2.0", optional = true}

[tool.poetry.extras]
mcp = ["mcp"]
webrtc = ["aiortc"]
# Courier: in-memory service + ExchangeService (e.g. embedding the courier).
courier = ["pydantic-settings"]
# Courier dev/upload server (FastAPI app factory). fastapi is already core.
courier-server = ["pydantic-settings", "uvicorn", "python-multipart"]
# Courier production Azure Blob backend + Function host.
courier-azure = ["pydantic-settings", "azure-storage-blob", "azure-identity"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.23"
mcp = ">=1.0"
# Courier test suite (tests/courier) exercises the service + FastAPI server.
pydantic-settings = ">=2.7,<3.0"
python-multipart = ">=0.0.18,<1.0"

[tool.poetry.group.docs.dependencies]
mkdocs-material = "^9.7.6"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
