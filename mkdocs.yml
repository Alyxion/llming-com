site_name: llming-com
site_description: Shared communication primitives for llming applications.
repo_url: https://github.com/Alyxion/llming-com
docs_dir: docs/manual
site_dir: docs/_site

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Light mode
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Dark mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - toc.follow

plugins:
  - search

extra_css:
  - assets/stylesheets/diagram-lightbox.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10.9.3/dist/mermaid.min.js
  - assets/javascripts/mermaid-init.js
  - assets/javascripts/diagram-lightbox.js

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - P2P:
    - Workflow: p2p/workflow.md
